      - "./MapApp/MapApp/bin/Debug/net8.0-windows:/veri"
    command: >
      python trafikIsigiKontrolSistemi.py 
      --camera KAMERA_4 
      --video "/veri/tayi2.mp4" 
      --data_dir "/veri"